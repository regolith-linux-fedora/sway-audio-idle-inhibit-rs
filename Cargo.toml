[package]
name = "sway-audio-idle-inhibit"
version = "2.1.0"
edition = "2021"
rust-version = "1.89"
description = "Prevents the session from going idle while audio plays or records"
license = "GPL-3.0-or-later"
homepage = "https://github.com/ErikReider/SwayAudioIdleInhibit"
publish = false

[dependencies]
libpulse-binding = "2.30.1"
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }
signal-hook = "0.3.18"

[lints.rust]
unsafe_code = "forbid"
